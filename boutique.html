<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#fbf3f1;
  --surface:#ffffff;
  --surface-2:#fdf8f6;
  --ink:#3b1f2b;
  --ink-soft:#8c6b76;
  --ink-faint:#c3a9ae;
  --accent:#a63a50;
  --accent-ink:#ffffff;
  --accent-soft:#f3dde1;
  --gold:#b6802f;
  --gold-soft:#f5e6cd;
  --sage:#4c7a5e;
  --sage-soft:#dcece2;
  --line:#efdcd9;
  --danger:#b23a3a;
  --danger-soft:#f6dede;
  --shadow: 0 8px 24px -12px rgba(59,31,43,0.28);
  --radius: 18px;
  --radius-sm: 12px;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --bg:#241419;
    --surface:#2f1b22;
    --surface-2:#35202a;
    --ink:#f6e9ec;
    --ink-soft:#c9a3ac;
    --ink-faint:#7a5560;
    --accent:#e0748a;
    --accent-ink:#2b0e15;
    --accent-soft:#4a2530;
    --gold:#e2b869;
    --gold-soft:#4a3a20;
    --sage:#8fc0a3;
    --sage-soft:#213b2c;
    --line:#4a2c35;
    --danger:#e58b8b;
    --danger-soft:#4a2424;
    --shadow: 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg:#241419; --surface:#2f1b22; --surface-2:#35202a; --ink:#f6e9ec; --ink-soft:#c9a3ac; --ink-faint:#7a5560;
  --accent:#e0748a; --accent-ink:#2b0e15; --accent-soft:#4a2530; --gold:#e2b869; --gold-soft:#4a3a20;
  --sage:#8fc0a3; --sage-soft:#213b2c; --line:#4a2c35; --danger:#e58b8b; --danger-soft:#4a2424;
  --shadow: 0 8px 24px -12px rgba(0,0,0,0.5);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Work Sans", sans-serif;
  overflow:hidden;
}
h1,h2,h3,.display{ font-family:"Fraunces", serif; font-weight:600; letter-spacing:-0.01em; }
button{ font-family:inherit; }
input,select,textarea{ font-family:inherit; }
::-webkit-scrollbar{ width:0; height:0; }

#app{ position:fixed; inset:0; display:flex; flex-direction:column; max-width:560px; margin:0 auto; background:var(--bg); }

/* ---- header ---- */
.topbar{
  display:flex; align-items:center; gap:10px; padding:16px 18px 12px;
  flex-shrink:0;
}
.topbar h1{ font-size:22px; margin:0; flex:1; color:var(--ink); }
.iconbtn{
  width:40px; height:40px; border-radius:50%; border:none; background:var(--surface);
  color:var(--accent); display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow: var(--shadow); flex-shrink:0;
}
.iconbtn:active{ transform:scale(0.94); }

/* ---- scroll area ---- */
.screen{ flex:1; overflow-y:auto; padding:0 18px 100px; -webkit-overflow-scrolling:touch; }
.screen::-webkit-scrollbar{ display:none; }

/* ---- bottom nav ---- */
.tabbar{
  position:absolute; left:0; right:0; bottom:0; max-width:560px; margin:0 auto;
  display:flex; background:var(--surface); border-top:1px solid var(--line);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  flex-shrink:0; z-index:20;
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--ink-faint); padding:6px 2px; cursor:pointer; font-size:11px;
}
.tab svg{ width:22px; height:22px; }
.tab.active{ color:var(--accent); }
.tab span{ font-weight:500; }

/* ---- cards ---- */
.card{
  background:var(--surface); border-radius:var(--radius); padding:16px;
  box-shadow:var(--shadow); margin-bottom:12px;
}
.section-title{ font-size:13px; text-transform:none; color:var(--ink-soft); margin:22px 0 10px; font-weight:600; }
.section-title:first-child{ margin-top:4px; }

/* dashboard stat grid */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat{
  background:var(--surface); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);
}
.stat .num{ font-family:"Fraunces",serif; font-size:26px; font-weight:600; line-height:1.1; }
.stat .lbl{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
.stat.warn .num{ color:var(--gold); }
.stat.danger .num{ color:var(--danger); }
.stat.good .num{ color:var(--sage); }

.quickrow{ display:flex; gap:10px; margin:14px 0 4px; }
.btn{
  border:none; border-radius:999px; padding:12px 18px; font-size:14.5px; font-weight:600;
  cursor:pointer; display:inline-flex; align-items:center; gap:6px; justify-content:center;
}
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-soft{ background:var(--accent-soft); color:var(--accent); }
.btn-gold{ background:var(--gold-soft); color:var(--gold); }
.btn-outline{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
.btn-block{ width:100%; }
.btn:active{ transform:scale(0.97); }
.btn:disabled{ opacity:0.5; }

.alert-row{
  display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);
}
.alert-row:last-child{ border-bottom:none; }
.dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot.warn{ background:var(--gold); } .dot.danger{ background:var(--danger); }
.alert-row .txt{ flex:1; font-size:14px; }
.alert-row .txt b{ font-weight:600; }
.alert-row .sub{ font-size:12px; color:var(--ink-soft); }

/* list items (produits/clients/etc) */
.searchbar{
  display:flex; align-items:center; gap:8px; background:var(--surface); border-radius:999px;
  padding:10px 16px; box-shadow:var(--shadow); margin-bottom:14px;
}
.searchbar input{ border:none; outline:none; background:none; flex:1; font-size:14.5px; color:var(--ink); }
.searchbar svg{ color:var(--ink-faint); flex-shrink:0; }

.plist{ display:flex; flex-direction:column; gap:10px; }
.pitem{
  display:flex; align-items:center; gap:12px; background:var(--surface); border-radius:var(--radius);
  padding:10px 12px; box-shadow:var(--shadow); cursor:pointer;
}
.pitem:active{ transform:scale(0.985); }
.thumb{
  width:52px; height:52px; border-radius:14px; background:var(--surface-2); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--ink-faint);
}
.thumb img{ width:100%; height:100%; object-fit:cover; }
.pitem .info{ flex:1; min-width:0; }
.pitem .name{ font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pitem .meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
.pitem .right{ text-align:right; flex-shrink:0; }
.pitem .price{ font-weight:600; font-size:14.5px; }
.badge{
  display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; margin-top:4px;
}
.badge.warn{ background:var(--gold-soft); color:var(--gold); }
.badge.danger{ background:var(--danger-soft); color:var(--danger); }
.badge.ok{ background:var(--sage-soft); color:var(--sage); }

.empty{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
.empty .big{ font-size:40px; margin-bottom:10px; }
.empty p{ font-size:14px; line-height:1.5; margin:0 0 16px; }

/* fab */
.fab{
  position:absolute; right:18px; bottom:88px; width:56px; height:56px; border-radius:50%;
  background:var(--accent); color:var(--accent-ink); border:none; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:15;
}
.fab:active{ transform:scale(0.94); }

/* sheet / modal */
.overlay{
  position:absolute; inset:0; background:rgba(59,31,43,0.35); z-index:30; display:flex; align-items:flex-end;
  animation:fadein .15s ease;
}
@keyframes fadein{ from{opacity:0} to{opacity:1} }
.sheet{
  background:var(--bg); width:100%; max-height:92%; border-radius:24px 24px 0 0; overflow-y:auto;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom)); animation:slideup .2s ease;
}
@keyframes slideup{ from{transform:translateY(24px); opacity:.4} to{transform:translateY(0); opacity:1} }
.sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:99px; margin:6px auto 14px; }
.sheet h2{ font-size:19px; margin:0 0 16px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:600; }
.field input, .field select, .field textarea{
  width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--radius-sm);
  padding:11px 13px; font-size:14.5px; color:var(--ink); outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--accent); }
.field textarea{ resize:vertical; min-height:70px; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.photo-pick{
  width:100%; aspect-ratio:2/1; border-radius:var(--radius-sm); border:1.5px dashed var(--ink-faint);
  background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--ink-soft); font-size:13px; cursor:pointer; overflow:hidden; position:relative; gap:6px;
}
.photo-pick img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.sheet-actions{ display:flex; gap:10px; margin-top:6px; }
.sheet-actions .btn{ flex:1; }
.pillrow{ display:flex; gap:8px; flex-wrap:wrap; }
.pill{
  border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px;
  font-size:13px; cursor:pointer; color:var(--ink-soft);
}
.pill.on{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }

/* toast */
.toast{
  position:absolute; left:50%; bottom:96px; transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:11px 20px; border-radius:999px; font-size:13.5px; z-index:60; box-shadow:var(--shadow);
  animation:toastin .18s ease;
}
@keyframes toastin{ from{opacity:0; transform:translate(-50%,10px)} to{opacity:1; transform:translate(-50%,0)} }

/* lock screen */
.lock{ position:absolute; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; }
.lock .mark{ font-size:44px; margin-bottom:6px; }
.lock h1{ font-size:24px; margin:0 0 4px; }
.lock p{ color:var(--ink-soft); font-size:13.5px; margin:0 0 26px; }
.dots{ display:flex; gap:14px; margin-bottom:26px; }
.pdot{ width:14px; height:14px; border-radius:50%; border:1.5px solid var(--ink-faint); }
.pdot.fill{ background:var(--accent); border-color:var(--accent); }
.keypad{ display:grid; grid-template-columns:repeat(3,64px); gap:14px; }
.key{
  width:64px; height:64px; border-radius:50%; border:none; background:var(--surface); color:var(--ink);
  font-size:22px; font-weight:600; box-shadow:var(--shadow); cursor:pointer;
}
.key:active{ transform:scale(0.93); }
.key.ghost{ background:none; box-shadow:none; color:var(--ink-soft); font-size:13px; }
.lock-err{ color:var(--danger); font-size:13px; height:16px; margin-top:14px; }

/* receipt */
.receipt{ background:var(--surface); border-radius:var(--radius); padding:20px; }
.receipt .rhead{ text-align:center; margin-bottom:14px; }
.receipt .rline{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; border-bottom:1px dashed var(--line); }
.receipt .rtotal{ display:flex; justify-content:space-between; font-size:16px; font-weight:700; padding-top:12px; }

/* tabs (commandes/rapports period) */
.segrow{ display:flex; background:var(--surface); border-radius:999px; padding:4px; box-shadow:var(--shadow); margin-bottom:14px; }
.seg{ flex:1; border:none; background:none; padding:9px 4px; border-radius:999px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
.seg.on{ background:var(--accent); color:var(--accent-ink); }

.bars{ display:flex; align-items:flex-end; gap:6px; height:110px; margin:10px 0 4px; }
.bar{ flex:1; background:var(--accent-soft); border-radius:6px 6px 0 0; position:relative; min-height:3px; }
.bar b{ display:block; background:var(--accent); width:100%; border-radius:6px 6px 0 0; position:absolute; bottom:0; }
.barlabels{ display:flex; gap:6px; }
.barlabels span{ flex:1; text-align:center; font-size:10px; color:var(--ink-faint); }

.top-produits-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
.top-produits-row:last-child{ border-bottom:none; }
.rank{ width:22px; height:22px; border-radius:50%; background:var(--gold-soft); color:var(--gold); font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

a.wa-link{ text-decoration:none; }

.menu-list{ display:flex; flex-direction:column; gap:10px; }
.menu-item{ display:flex; align-items:center; gap:14px; background:var(--surface); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); cursor:pointer; }
.menu-item .ic{ width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.menu-item .tt{ font-weight:600; font-size:14.5px; }
.menu-item .dd{ font-size:12px; color:var(--ink-soft); }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= STATE ============================= */
const State = {
  unlocked:false,
  passInput:'',
  screen:'accueil',
  search:'',
  data:{ produits:[], clients:[], ventes:[], depenses:[], commandes:[], config:{} },
  ready:false,
  modal:null,      // {type:'produit'|'vente'|'client'|'depense'|'commande', payload}
  toastMsg:null,
  reportPeriod:'jour',
  ordersTab:'En attente',
  receipt:null,
  db:null, assets:null, downloads:null, storageMode:'local'
};

function uid(){ return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8); }
function money(n){ n = Number(n)||0; const cur = State.data.config.devise || 'FCFA'; return n.toLocaleString('fr-FR',{maximumFractionDigits:0}) + ' ' + cur; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(ts){ const d = new Date(ts); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateShort(ts){ const d = new Date(ts); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg){
  State.toastMsg = msg;
  render();
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ State.toastMsg=null; render(); }, 2200);
}

/* ============================= PERSISTENCE ============================= */
const LS_KEY = 'boutique_data_v1';

function localSave(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(State.data)); }catch(e){}
}
function localLoad(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) State.data = Object.assign({produits:[],clients:[],ventes:[],depenses:[],commandes:[],config:{}}, JSON.parse(raw));
  }catch(e){}
}

let unsubs = [];
async function initStorage(){
  try{
    if(window.claude && window.claude.use){
      State.db = await window.claude.use('db');
    }
  }catch(e){ State.db = null; }

  if(State.db){
    State.storageMode = 'cloud';
    try{ State.assets = await window.claude.use('assets'); }catch(e){ State.assets = null; }
    try{ State.downloads = await window.claude.use('downloads'); }catch(e){ State.downloads = null; }
    subscribeAll();
  } else {
    State.storageMode = 'local';
    localLoad();
    State.ready = true;
    render();
  }
}

function subscribeAll(){
  const cols = ['produits','clients','ventes','depenses','commandes'];
  let gotFirst = {produits:false,clients:false,ventes:false,depenses:false,commandes:false};
  cols.forEach(col=>{
    const q = State.db.collection(col).orderBy('createdAt','desc').limit(500);
    const un = q.onSnapshot(snap=>{
      State.data[col] = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      gotFirst[col] = true;
      if(!State.ready && Object.values(gotFirst).every(Boolean)){ State.ready = true; }
      render();
    }, err=>{ console.error(col, err); });
    unsubs.push(un);
  });
  const cun = State.db.doc('config/app').onSnapshot(snap=>{
    State.data.config = snap.exists ? snap.data() : {};
    render();
  });
  unsubs.push(cun);
  // safety: mark ready after a short delay even if some collections are empty (snapshot still fires for empty)
}

async function saveDoc(col, id, data){
  if(State.storageMode==='cloud'){
    const ref = id ? State.db.collection(col).doc(id) : State.db.collection(col).doc();
    await ref.set(data);
    return ref.id;
  } else {
    const arr = State.data[col];
    if(id){
      const i = arr.findIndex(x=>x.id===id);
      if(i>-1) arr[i] = Object.assign({id}, data); else arr.unshift(Object.assign({id},data));
    } else {
      id = uid();
      arr.unshift(Object.assign({id}, data));
    }
    localSave();
    return id;
  }
}
async function updateDoc(col, id, patch){
  if(State.storageMode==='cloud'){
    await State.db.collection(col).doc(id).update(patch);
  } else {
    const i = State.data[col].findIndex(x=>x.id===id);
    if(i>-1) Object.assign(State.data[col][i], patch);
    localSave();
  }
}
async function deleteDoc(col, id){
  if(State.storageMode==='cloud'){
    await State.db.collection(col).doc(id).delete();
  } else {
    State.data[col] = State.data[col].filter(x=>x.id!==id);
    localSave();
  }
}
async function saveConfig(patch){
  State.data.config = Object.assign({}, State.data.config, patch);
  if(State.storageMode==='cloud'){
    await State.db.doc('config/app').set(State.data.config);
  } else {
    localSave();
  }
}

/* ============================= PHOTO ============================= */
async function handlePhotoFile(file, onDone){
  if(!file) return;
  if(State.storageMode==='cloud' && State.assets){
    try{
      const res = await State.assets.upload(file);
      onDone({photoId:res.id, photoUrl:res.url});
    }catch(e){ toast("Photo non enregistrée"); }
  } else {
    const reader = new FileReader();
    reader.onload = ()=>{
      // downscale
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        const maxW = 480; const scale = Math.min(1, maxW/img.width);
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        onDone({photoUrl:canvas.toDataURL('image/jpeg',0.75)});
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
}
function photoUrlFor(item){
  if(item.photoUrl) return item.photoUrl;
  if(item.photoId) return '/_blob/'+item.photoId;
  return null;
}

/* ============================= ICONS ============================= */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M2.5 3h2l2.2 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L20 7H5.2"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 19c.8-3.3 3.2-5 6.2-5s5.4 1.7 6.2 5"/><path d="M15.5 4.3a3.2 3.2 0 0 1 0 6.2"/><path d="M17 14c2.4.4 4 1.9 4.6 5"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',

/* ============================= COMPUTED HELPERS ============================= */
function lowStock(p){ return p.quantite <= (p.seuil!=null ? p.seuil : 5); }
function expiringSoon(p){
  if(!p.dateExpiration) return false;
  const days = (new Date(p.dateExpiration) - new Date())/86400000;
  return days <= 7;
}
function expired(p){
  if(!p.dateExpiration) return false;
  return (new Date(p.dateExpiration) - new Date()) < 0;
}
function isSameDay(ts, iso){ return new Date(ts).toISOString().slice(0,10) === iso; }
function periodStart(period){
  const d = new Date();
  if(period==='jour'){ d.setHours(0,0,0,0); return d.getTime(); }
  if(period==='semaine'){ d.setHours(0,0,0,0); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getTime(); }
  d.setDate(1); d.setHours(0,0,0,0); return d.getTime();
}
function ventesInPeriod(period){ const s = periodStart(period); return State.data.ventes.filter(v=>v.createdAt>=s); }
function depensesInPeriod(period){ const s = periodStart(period); return State.data.depenses.filter(v=>v.createdAt>=s); }

/* ============================= RENDER ROOT ============================= */
function render(){
  const app = document.getElementById('app');
  if(!State.ready){
    app.innerHTML = renderSplash();
    return;
  }
  if(State.data.config.password && !State.unlocked){
    app.innerHTML = renderLock();
    bindLock();
    return;
  }
  app.innerHTML = renderShell();
  bindShell();
}

function renderSplash(){
  return `<div style="height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--ink-soft)">
    <div style="font-size:38px">🌷</div><div style="font-size:13px">Chargement…</div></div>`;
}

/* ============================= LOCK SCREEN ============================= */
function renderLock(){
  const len = State.passInput.length;
  const target = (State.data.config.password||'').length || 4;
  let dots = '';
  for(let i=0;i<Math.max(target,4);i++) dots += `<div class="pdot ${i<len?'fill':''}"></div>`;
  const keys = [1,2,3,4,5,6,7,8,9,'','0','del'];
  return `<div class="lock">
    <div class="mark">🌷</div>
    <h1>Ma Boutique</h1>
    <p>Entrez votre code pour continuer</p>
    <div class="dots">${dots}</div>
    <div class="keypad">
      ${keys.map(k=> k===''? `<div></div>` : `<button class="key ${k==='del'?'ghost':''}" data-k="${k}">${k==='del'?'Effacer':k}</button>`).join('')}
    </div>
    <div class="lock-err">${State.lockError||''}</div>
  </div>`;
}
function bindLock(){
  document.querySelectorAll('.key').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.k;
      if(k==='del'){ State.passInput = State.passInput.slice(0,-1); }
      else { State.passInput += k; }
      State.lockError = null;
      const target = State.data.config.password;
      if(State.passInput.length >= (target||'').length && target){
        if(State.passInput === target){ State.unlocked = true; State.passInput=''; render(); return; }
        else { State.lockError = 'Code incorrect'; State.passInput=''; }
      }
      render();
    };
  });
}

function renderFab(){

  return `<button class="fab" id="fab">${I.plus}</button>`;

function renderTabbar(){
  const tabs = [

function renderScreen(){

    case 'plus': return screenPlus();

    case 'commandes': return screenCommandes();
    case 'rapports': return screenRapports();
    case 'reglages': return screenReglages();
    default: return '';
  }
}

/* ============================= ACCUEIL ============================= */
function screenAccueil(){

  const ventesToday = State.data.ventes.filter(v=>isSameDay(v.createdAt, iso));
  const totalToday = ventesToday.reduce((s,v)=>s+v.total,0);
  const beneficeToday = ventesToday.reduce((s,v)=>s+v.benefice,0);
  const stockValue = State.data.produits.reduce((s,p)=>s+ (p.cout||0)*(p.quantite||0),0);
  const bas = State.data.produits.filter(lowStock);
  const exp = State.data.produits.filter(p=>expiringSoon(p)||expired(p));

  const alerts = [];
  bas.slice(0,4).forEach(p=> alerts.push({type:'danger', text:`<b>${esc(p.nom)}</b> — stock bas`, sub:`${p.quantite} restant(s)`}));
  exp.slice(0,4).forEach(p=> alerts.push({type: expired(p)?'danger':'warn', text:`<b>${esc(p.nom)}</b> — ${expired(p)?'expiré':'expire bientôt'}`, sub: p.dateExpiration}));

  return `
    <div class="stat-grid">
      <div class="stat"><div class="num">${money(totalToday)}</div><div class="lbl">Ventes aujourd'hui</div></div>
      <div class="stat good"><div class="num">${money(beneficeToday)}</div><div class="lbl">Bénéfice aujourd'hui</div></div>
      <div class="stat"><div class="num">${money(stockValue)}</div><div class="lbl">Valeur du stock</div></div>
      <div class="stat ${bas.length?'danger':''}"><div class="num">${bas.length}</div><div class="lbl">Produits en alerte</div></div>
    </div>
    <div class="quickrow">
      <button class="btn btn-primary" id="qkVente">${I.plus} Nouvelle vente</button>
      <button class="btn btn-soft" id="qkProduit">${I.plus} Produit</button>
    </div>
    <div class="section-title">Alertes</div>
    <div class="card">
      ${alerts.length? alerts.map(a=>`<div class="alert-row"><div class="dot ${a.type}"></div><div class="txt">${a.text}<div class="sub">${esc(a.sub)}</div></div></div>`).join('')
        : `<div style="color:var(--ink-soft); font-size:13.5px; text-align:center; padding:8px 0;">Aucune alerte pour le moment ✨</div>`}
    </div>
    <div class="section-title">Dernières ventes</div>
    <div class="card">
      ${State.data.ventes.slice(0,5).length ? State.data.ventes.slice(0,5).map(v=>`
        <div class="alert-row"><div class="txt"><b>${money(v.total)}</b> ${v.clientNom?'· '+esc(v.clientNom):''}<div class="sub">${fmtDate(v.createdAt)}</div></div></div>
      `).join('') : `<div style="color:var(--ink-soft); font-size:13.5px; text-align:center; padding:8px 0;">Pas encore de vente</div>`}
    </div>
  `;
}

/* ============================= RAPPORTS ============================= */
function screenRapports(){
  const period = State.reportPeriod;
  const ventes = ventesInPeriod(period);
  const depenses = depensesInPeriod(period);
  const totalVentes = ventes.reduce((s,v)=>s+v.total,0);
  const totalBenefice = ventes.reduce((s,v)=>s+v.benefice,0);
  const totalDepenses = depenses.reduce((s,d)=>s+d.montant,0);
  const net = totalBenefice - totalDepenses;

  // top produits
  const counts = {};
  ventes.forEach(v=>v.items.forEach(it=>{ counts[it.nom] = (counts[it.nom]||0) + it.qty; }));
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);

  // last 7 days bar chart (always by day regardless of period, gives a quick trend)
  const days = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); days.push(d); }
  const dayTotals = days.map(d=>{
    const iso = d.toISOString().slice(0,10);
    return State.data.ventes.filter(v=>isSameDay(v.createdAt, iso)).reduce((s,v)=>s+v.total,0);
  });
  const maxDay = Math.max(1, ...dayTotals);

  return `
  <div class="segrow">
    <button class="seg ${period==='jour'?'on':''}" data-period="jour">Jour</button>
    <button class="seg ${period==='semaine'?'on':''}" data-period="semaine">Semaine</button>
    <button class="seg ${period==='mois'?'on':''}" data-period="mois">Mois</button>
  </div>
  <div class="stat-grid">
    <div class="stat"><div class="num">${money(totalVentes)}</div><div class="lbl">Ventes</div></div>
    <div class="stat good"><div class="num">${money(totalBenefice)}</div><div class="lbl">Bénéfice brut</div></div>
    <div class="stat danger"><div class="num">${money(totalDepenses)}</div><div class="lbl">Dépenses</div></div>
    <div class="stat ${net>=0?'good':'danger'}"><div class="num">${money(net)}</div><div class="lbl">Bénéfice net</div></div>
  </div>
  <div class="section-title">Tendance (7 derniers jours)</div>
  <div class="card">
    <div class="bars">${dayTotals.map(v=>`<div class="bar"><b style="height:${Math.max(4,(v/maxDay)*100)}%"></b></div>`).join('')}</div>
    <div class="barlabels">${days.map(d=>`<span>${d.toLocaleDateString('fr-FR',{weekday:'short'}).slice(0,3)}</span>`).join('')}</div>
  </div>
  <div class="section-title">Produits les plus vendus</div>
  <div class="card">
    ${top.length? top.map(([nom,qty],i)=>`<div class="top-produits-row"><div class="rank">${i+1}</div><div style="flex:1;font-size:14px;">${esc(nom)}</div><div style="font-weight:600;font-size:13.5px;">${qty} vendu(s)</div></div>`).join('')
      : `<div style="color:var(--ink-soft); font-size:13.5px; text-align:center;">Aucune vente sur cette période</div>`}
  </div>
  `;
}

function renderModal(){

  let inner = '';
  if(m.type==='produit') inner = modalProduit(m.payload);
  else if(m.type==='vente') inner = modalVente(m.payload);
  else if(m.type==='client') inner = modalClient(m.payload);
  else if(m.type==='depense') inner = modalDepense(m.payload);
  else if(m.type==='commande') inner = modalCommande(m.payload);
  else if(m.type==='receipt') inner = modalReceipt(m.payload);

}

/* ============================= BIND EVENTS ============================= */
function bindShell(){
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick = ()=>{ State.screen = b.dataset.tab; State.search=''; render(); };
  });
  const back = document.getElementById('btnBack');
  if(back) back.onclick = ()=>{ State.screen='plus'; render(); };
  const search = document.getElementById('btnSearch');
  if(search) search.onclick = ()=>{ openModal('search'); };
  const fab = document.getElementById('fab');
  if(fab) fab.onclick = ()=>{
    const map = {produits:'produit', ventes:'vente', clients:'client', depenses:'depense', commandes:'commande'};
    openModal(map[State.screen]);
  };
  const qkV = document.getElementById('qkVente'); if(qkV) qkV.onclick = ()=>openModal('vente');
  const qkP = document.getElementById('qkProduit'); if(qkP) qkP.onclick = ()=>openModal('produit');

  document.querySelectorAll('[data-goto]').forEach(el=> el.onclick = ()=>{ State.screen = el.dataset.goto; render(); });
  document.querySelectorAll('[data-open-produit]').forEach(el=> el.onclick = ()=>{
    const p = State.data.produits.find(x=>x.id===el.dataset.openProduit); openModal('produit', p);
  });
  document.querySelectorAll('[data-open-client]').forEach(el=> el.onclick = ()=>{
    const c = State.data.clients.find(x=>x.id===el.dataset.openClient); openModal('client', c);
  });
  document.querySelectorAll('[data-open-depense]').forEach(el=> el.onclick = ()=>{
    const d = State.data.depenses.find(x=>x.id===el.dataset.openDepense); openModal('depense', d);
  });
  document.querySelectorAll('[data-open-commande]').forEach(el=> el.onclick = ()=>{
    const c = State.data.commandes.find(x=>x.id===el.dataset.openCommande); openModal('commande', c);
  });
  document.querySelectorAll('[data-open-vente]').forEach(el=> el.onclick = ()=>{
    const v = State.data.ventes.find(x=>x.id===el.dataset.openVente); openModal('receipt', v);
  });
  document.querySelectorAll('[data-orderstab]').forEach(el=> el.onclick = ()=>{ State.ordersTab = el.dataset.orderstab; render(); });
  document.querySelectorAll('[data-period]').forEach(el=> el.onclick = ()=>{ State.reportPeriod = el.dataset.period; render(); });

  const search2 = document.getElementById('screen');
  if(State.screen==='produits' || State.screen==='clients'){
    // search icon already bound; but inline search bar could be added later if needed
  }

  if(State.modal) bindModal();
}

function openModal(type, payload){
  State.modal = {type, payload: payload||null};
  if(type==='vente') State.cart = [];
  render();
}
function closeModal(){ State.modal = null; render(); }

function bindModal(){
  const overlay = document.getElementById('overlay');
  overlay.addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

  const m = State.modal;
  if(m.type==='produit') bindProduitModal(m.payload);
  else if(m.type==='vente') bindVenteModal();
  else if(m.type==='client') bindClientModal(m.payload);
  else if(m.type==='depense') bindDepenseModal(m.payload);
  else if(m.type==='commande') bindCommandeModal(m.payload);
  else if(m.type==='receipt') bindReceiptModal(m.payload);
  else if(m.type==='search') bindSearchModal();
}

function bindProduitModal(p){
  p = p || {};
  let pendingPhoto = null;
  const pick = document.getElementById('photoPick');
  const input = document.getElementById('photoInput');
  pick.onclick = ()=> input.click();
  input.onchange = ()=>{
    const f = input.files[0];
    if(f) handlePhotoFile(f, (res)=>{ pendingPhoto = res; pick.innerHTML = `<img src="${res.photoUrl}">`; });
  };
  document.getElementById('btnSaveProduit').onclick = async ()=>{
    const nom = document.getElementById('fNom').value.trim();
    if(!nom){ toast('Le nom du produit est requis'); return; }
    const data = {
      nom,
      categorie: document.getElementById('fCategorie').value.trim(),
      reference: document.getElementById('fReference').value.trim(),
      prix: parseFloat(document.getElementById('fPrix').value)||0,
      cout: parseFloat(document.getElementById('fCout').value)||0,
      quantite: parseInt(document.getElementById('fQuantite').value)||0,
      seuil: parseInt(document.getElementById('fSeuil').value)||5,
      dateFabrication: document.getElementById('fFab').value||null,
      dateExpiration: document.getElementById('fExp').value||null,
      description: document.getElementById('fDesc').value.trim(),
      createdAt: p.createdAt || Date.now(),
    };
    if(pendingPhoto) Object.assign(data, pendingPhoto);
    else if(p.photoUrl) data.photoUrl = p.photoUrl;
    else if(p.photoId) data.photoId = p.photoId;
    await saveDoc('produits', p.id, data);
    toast(p.id?'Produit mis à jour':'Produit ajouté');
    closeModal();
  };
  const del = document.getElementById('btnDeleteProduit');
  if(del) del.onclick = async ()=>{ await deleteDoc('produits', p.id); toast('Produit supprimé'); closeModal(); };
}

function bindVenteModal(){
  State.cart = State.cart || [];
  const listEl = document.getElementById('venteProduitList');
  const cartEl = document.getElementById('venteCart');
  const totalEl = document.getElementById('venteTotal');
  const confirmBtn = document.getElementById('btnConfirmVente');
  const searchInput = document.getElementById('venteSearch');

  function renderProduitList(){
    const q = (searchInput.value||'').toLowerCase();
    const list = State.data.produits.filter(p=>p.quantite>0 && p.nom.toLowerCase().includes(q)).slice(0,20);
    listEl.innerHTML = list.map(p=>`<div class="pitem" style="padding:8px 10px;" data-pick="${p.id}">
      <div class="thumb" style="width:38px;height:38px;">${photoUrlFor(p)?`<img src="${photoUrlFor(p)}">`:I.box}</div>
      <div class="info"><div class="name" style="font-size:13.5px;">${esc(p.nom)}</div><div class="meta">${p.quantite} en stock</div></div>
      <div class="price" style="font-size:13px;">${money(p.prix)}</div>
    </div>`).join('') || `<div style="font-size:13px;color:var(--ink-soft);padding:8px 0;">Aucun résultat</div>`;
    listEl.querySelectorAll('[data-pick]').forEach(el=> el.onclick = ()=>{
      const p = State.data.produits.find(x=>x.id===el.dataset.pick);
      const existing = State.cart.find(c=>c.produitId===p.id);
      if(existing){ if(existing.qty < p.quantite) existing.qty++; }
      else State.cart.push({produitId:p.id, nom:p.nom, qty:1, prixUnite:p.prix, coutUnite:p.cout, stock:p.quantite});
      renderCart();
    });
  }
  function renderCart(){
    if(!State.cart.length){ cartEl.innerHTML = `<div style="font-size:13px;color:var(--ink-soft);text-align:center;">Panier vide</div>`; }
    else {
      cartEl.innerHTML = State.cart.map((it,i)=>`
        <div class="alert-row">
          <div class="txt"><b>${esc(it.nom)}</b><div class="sub">${money(it.prixUnite)} × ${it.qty}</div></div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button data-dec="${i}" class="btn btn-outline" style="padding:4px 10px;">−</button>
            <span>${it.qty}</span>
            <button data-inc="${i}" class="btn btn-outline" style="padding:4px 10px;">+</button>
          </div>
        </div>`).join('');
      cartEl.querySelectorAll('[data-inc]').forEach(b=> b.onclick=()=>{ const it=State.cart[b.dataset.inc]; if(it.qty<it.stock) it.qty++; renderCart(); });
      cartEl.querySelectorAll('[data-dec]').forEach(b=> b.onclick=()=>{ const idx=b.dataset.dec; State.cart[idx].qty--; if(State.cart[idx].qty<=0) State.cart.splice(idx,1); renderCart(); });
    }
    const total = State.cart.reduce((s,it)=>s+it.qty*it.prixUnite,0);
    totalEl.textContent = money(total);
    confirmBtn.disabled = State.cart.length===0;
  }
  searchInput.oninput = renderProduitList;
  renderProduitList(); renderCart();

  confirmBtn.onclick = async ()=>{
    confirmBtn.disabled = true;
    const clientId = document.getElementById('venteClient').value || null;
    const client = clientId ? State.data.clients.find(c=>c.id===clientId) : null;
    const total = State.cart.reduce((s,it)=>s+it.qty*it.prixUnite,0);
    const benefice = State.cart.reduce((s,it)=>s+it.qty*(it.prixUnite-it.coutUnite),0);
    const vente = {
      items: State.cart.map(it=>({produitId:it.produitId, nom:it.nom, qty:it.qty, prixUnite:it.prixUnite, coutUnite:it.coutUnite})),
      clientId, clientNom: client?client.nom:null, total, benefice, createdAt: Date.now()
    };
    const id = await saveDoc('ventes', null, vente);
    for(const it of State.cart){
      const p = State.data.produits.find(x=>x.id===it.produitId);
      if(p) await updateDoc('produits', p.id, {quantite: Math.max(0,(p.quantite||0)-it.qty)});
    }
    vente.id = id;
    State.cart = [];
    State.modal = null;
    toast('Vente enregistrée');
    render();
    openModal('receipt', vente);
  };
}

function bindReceiptModal(v){
  document.getElementById('btnCloseReceipt').onclick = closeModal;
  document.getElementById('btnReceiptPdf').onclick = async ()=>{
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:'pt', format:[300, 500]});
      const cfg = State.data.config;
      let y = 40;
      doc.setFontSize(16); doc.text(cfg.nomBoutique||'Ma Boutique', 150, y, {align:'center'}); y+=20;
      doc.setFontSize(10); doc.text(new Date(v.createdAt).toLocaleString('fr-FR'), 150, y, {align:'center'}); y+=24;
      doc.setFontSize(11);
      v.items.forEach(it=>{
        doc.text(`${it.nom} x${it.qty}`, 30, y);
        doc.text(money(it.qty*it.prixUnite), 270, y, {align:'right'});
        y += 18;
      });
      y += 8; doc.line(30,y,270,y); y+=20;
      doc.setFontSize(13); doc.text('Total', 30, y); doc.text(money(v.total), 270, y, {align:'right'});
      const blob = doc.output('blob');
      if(State.downloads){
        await State.downloads.save({filename:`recu-${v.id||Date.now()}.pdf`, data:blob});
        toast('Reçu téléchargé');
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=`recu-${v.id||Date.now()}.pdf`; a.click();
        toast('Reçu téléchargé');
      }
    }catch(e){ toast('Impossible de générer le PDF'); }
  };
}

function bindSearchModal(){
  const input = document.getElementById('globalSearch');
  const resultsEl = document.getElementById('globalSearchResults');
  input.oninput = ()=>{
    const q = input.value.toLowerCase().trim();
    if(!q){ resultsEl.innerHTML=''; return; }
    const prods = State.data.produits.filter(p=>p.nom.toLowerCase().includes(q)).slice(0,6);
    const clis = State.data.clients.filter(c=>c.nom.toLowerCase().includes(q)).slice(0,6);
    resultsEl.innerHTML = `
      ${prods.length?`<div class="section-title">Produits</div>`+prods.map(p=>`<div class="pitem" data-res-produit="${p.id}"><div class="thumb">${photoUrlFor(p)?`<img src="${photoUrlFor(p)}">`:I.box}</div><div class="info"><div class="name">${esc(p.nom)}</div><div class="meta">${p.quantite} en stock</div></div><div class="price">${money(p.prix)}</div></div>`).join(''):''}
      ${clis.length?`<div class="section-title">Clientes</div>`+clis.map(c=>`<div class="pitem" data-res-client="${c.id}"><div class="thumb">${I.users}</div><div class="info"><div class="name">${esc(c.nom)}</div></div></div>`).join(''):''}
      ${!prods.length && !clis.length ? `<div style="text-align:center;color:var(--ink-soft);font-size:13.5px;padding:20px 0;">Aucun résultat</div>`:''}
    `;
    resultsEl.querySelectorAll('[data-res-produit]').forEach(el=> el.onclick=()=>{ const p=State.data.produits.find(x=>x.id===el.dataset.resProduit); State.screen='produits'; closeModal(); setTimeout(()=>openModal('produit',p),50); });
    resultsEl.querySelectorAll('[data-res-client]').forEach(el=> el.onclick=()=>{ const c=State.data.clients.find(x=>x.id===el.dataset.resClient); State.screen='clients'; closeModal(); setTimeout(()=>openModal('client',c),50); });
  };
}

/* reglages bindings need to happen post-render since screen is dynamic */
document.addEventListener('click', function(e){
  if(e.target.id==='btnSavePass'){
    const val = document.getElementById('inpPass').value.trim();
    saveConfig({password: val||null}).then(()=>toast('Code mis à jour'));
  }
  if(e.target.id==='btnSaveBoutique'){
    saveConfig({
      devise: document.getElementById('inpDevise').value.trim()||'FCFA',
      nomBoutique: document.getElementById('inpNomBoutique').value.trim(),
      waBoutique: document.getElementById('inpWaBoutique').value.trim(),
    }).then(()=>toast('Informations enregistrées'));
  }
  if(e.target.id==='btnExport'){
    const blob = new Blob([JSON.stringify(State.data,null,2)], {type:'application/json'});
    if(State.downloads){
      State.downloads.save({filename:'boutique-sauvegarde.json', data:blob}).catch(()=>{});
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='boutique-sauvegarde.json'; a.click();
    }
  }
});

initStorage();
